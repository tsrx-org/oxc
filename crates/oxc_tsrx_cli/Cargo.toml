[package]
name = "oxc_tsrx_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# One multi-call executable for all three tools. `src/main.rs` documents how
# `argv[0]` and the `lint` / `fmt` / `lsp` subcommands select one.
[[bin]]
name = "oxc-tsrx"
path = "src/main.rs"

[dependencies]
ignore = "0.4.25"
oxc_adapter = { path = "../oxc_adapter" }
rayon = "1.11.0"
serde_json = "1.0.150"
tsrx_format = { path = "../tsrx_format" }
tsrx_lint = { path = "../tsrx_lint" }

[lints]
workspace = true
