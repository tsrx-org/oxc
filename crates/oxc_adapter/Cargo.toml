[package]
name = "oxc_adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["toolchain", "editor"]
parser = [
  "dep:miette",
  "dep:oxc_data_structures",
  "dep:oxc_diagnostics",
  "dep:oxc_estree",
  "dep:tsrx_tape_schema",
  "oxc_ast/serialize",
  "oxc_ast_visit/serialize",
]
toolchain = [
  "dep:oxc_config",
  "dep:oxc_diagnostics",
  "dep:oxc_formatter",
  "dep:oxc_formatter_core",
  "dep:oxc_linter",
  "dep:serde",
  "dep:serde_json",
  "oxc_semantic/cfg",
  "oxc_semantic/linter",
]
# The LSP editor integration pulls an async runtime and protocol stack that
# cannot target wasm; lint/format consumers may opt out.
editor = [
  "toolchain",
  "dep:oxc_language_server",
  "dep:tokio",
  "dep:tower-lsp-server",
]

[dependencies]
oxc_allocator = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
oxc_ast = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
oxc_ast_visit = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
oxc_config = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40", optional = true }
oxc_data_structures = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40", features = ["code_buffer"], optional = true }
oxc_diagnostics = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40", optional = true }
oxc_estree = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40", features = ["serialize"], optional = true }
oxc_formatter = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40", optional = true }
oxc_formatter_core = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40", optional = true }
oxc_linter = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40", optional = true }
oxc_language_server = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40", optional = true }
oxc_parser = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
oxc_semantic = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
oxc_span = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
oxc_syntax = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
miette = { package = "oxc-miette", version = "3.0.0", optional = true }
rustc-hash = "2.1.3"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }
tokio = { version = "1.52.3", features = ["rt-multi-thread"], optional = true }
tower-lsp-server = { version = "0.23.0", optional = true }
tsrx_tape_schema = { path = "../tsrx_tape_schema", optional = true }

[[test]]
name = "parser_results"
path = "tests/parser_results.rs"
required-features = ["parser"]

[[test]]
name = "parser_tape"
path = "tests/parser_tape.rs"
required-features = ["parser"]

[lints]
workspace = true
