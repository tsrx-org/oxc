name: Build website artifact
# Optimized with validated WASM artifact caching

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Write, for exactly one reason: the build job commits website-oxc/wasm-pin.json
# back to main so the oxc.tsrx.dev Vercel build can find the demo engine it
# cannot compile (see "Publish the proven demo engine" below). Jobs that have no
# business writing say so themselves.
permissions:
  contents: write

concurrency:
  group: site-artifact-${{ github.ref }}
  # A superseded pull-request run is wasted wall clock. A superseded run on main
  # is a deploy that never happened, so those still queue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests get the site tests and nothing else.
  #
  # The drift test that binds docs/reference/platform-support.md to
  # packages/toolchain/dist/native-targets.js lives in test:site:unit, and this
  # workflow was the only place that ran it. Triggering on push to main meant a
  # pull request could diverge the published support matrix from the target list
  # this project actually builds and only find out after it landed.
  #
  # This job exists rather than simply letting `build` run on pull requests
  # because `build` installs a Rust target and compiles the WebAssembly demo
  # engine. Even with Cargo caching and validated WASM artifact caching, that
  # is still extra time per pull request to prove something no pull request is
  # asking about. Everything the site tests need is a plain `docs:build`: the
  # site falls back to the static demo when the WebAssembly artifact is absent
  # (docs/build.mjs:1743-1750), and both suites were confirmed green against a
  # build with no wasm artifact at all. The full artifact-and-deploy path stays
  # on push and dispatch, where the bytes it produces are actually used.
  #
  # The one thing a pull request does not get: the checks that need the real
  # engine. "generated WebAssembly executes the real lint, format, and
  # projection engines" self-skips without the artifact, and the static
  # verifier runs 113 checks here against 151 on `main`. Everything that binds
  # the docs to this repository's own source, including the platform-support
  # drift test, runs in both.
  #
  # Cost, measured on this branch: ~2 min here vs ~2–6 min for the build
  # job (WASM cache hit: ~2–3 min; miss: ~5–6 min) plus ~30s to deploy.
  site-tests:
    name: Site tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A pull request proves the site builds. It never publishes anything, so it
    # keeps the read-only token it had before this file needed write.
    permissions:
      contents: read
    steps:
      - name: Check out the pull request revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install the pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install the locked documentation graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prove the site still builds and its claims still hold
        run: |
          pnpm run docs:build
          pnpm run test:site:unit
          pnpm run test:site:static

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the selected exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install the pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install the locked documentation graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Compute WASM inputs hash
        id: wasm-hash
        run: |
          set -euo pipefail
          # Hash all inputs that affect the WASM build: demo-wasm source,
          # tsrx_* crate dependencies, Cargo manifests, and Rust toolchain.
          wasm_hash=$(
            {
              git ls-files -z \
                'docs/tools/demo-wasm/**' \
                'crates/tsrx_*/**' \
                'Cargo.toml' 'Cargo.lock' \
                'docs/tools/demo-wasm/Cargo.toml' \
                'docs/tools/demo-wasm/Cargo.lock' \
                'rust-toolchain.toml' \
              | sort -z \
              | xargs -0 shasum -a 256
              rustc --version
              echo "target:wasm32-wasip1-threads"
            } | shasum -a 256 | cut -d' ' -f1
          )
          echo "hash=${wasm_hash}" >> "${GITHUB_OUTPUT}"
          echo "WASM inputs hash: ${wasm_hash}"

      - name: Restore cached WASM artifact
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: docs/tools/demo-wasm/dist
          key: wasm-${{ runner.os }}-${{ steps.wasm-hash.outputs.hash }}

      - name: Validate restored WASM artifact
        id: wasm-valid
        if: steps.wasm-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          wasm_dir="docs/tools/demo-wasm/dist"
          wasm_file="${wasm_dir}/demo-wasm.wasm"
          worker_file="${wasm_dir}/wasi-worker-browser.mjs"
          wasm_copy="${wasm_dir}/demo-wasm.wasm32-wasi.wasm"
          
          # Check all required files exist
          if [ ! -f "${wasm_file}" ] || [ ! -f "${worker_file}" ] || [ ! -f "${wasm_copy}" ]; then
            echo "WASM cache incomplete: missing files"
            echo "valid=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          
          # Check WASM file size is reasonable (should be ~9 MB, fail if < 5 MB)
          wasm_size=$(stat -c%s "${wasm_file}" 2>/dev/null || stat -f%z "${wasm_file}")
          if [ "${wasm_size}" -lt 5000000 ]; then
            echo "WASM cache invalid: file too small (${wasm_size} bytes)"
            echo "valid=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          
          # Check worker file has expected content
          if ! grep -q "MessageHandler" "${worker_file}" || ! grep -q "instantiateNapiModule" "${worker_file}"; then
            echo "WASM cache invalid: worker file corrupted"
            echo "valid=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          
          echo "WASM cache valid: ${wasm_size} bytes"
          echo "valid=true" >> "${GITHUB_OUTPUT}"

      - name: Install the threaded WASI Rust target
        if: steps.wasm-cache.outputs.cache-hit != 'true' || steps.wasm-valid.outputs.valid != 'true'
        run: rustup target add wasm32-wasip1-threads

      - name: Set up Rust cache
        if: steps.wasm-cache.outputs.cache-hit != 'true' || steps.wasm-valid.outputs.valid != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Build WASM artifact from scratch
        if: steps.wasm-cache.outputs.cache-hit != 'true' || steps.wasm-valid.outputs.valid != 'true'
        run: pnpm run docs:wasm

      - name: Build and prove the real browser-engine artifact
        run: |
          OXC_TSRX_REQUIRE_WASM=1 pnpm run docs:build
          pnpm run test:site:unit
          node tests/site/verify-static.mjs --require-wasm
          pnpm run docs:check

      # -----------------------------------------------------------------------
      # Deliver the proven engine to oxc.tsrx.dev.
      #
      # The Git-connected Vercel project builds that site from every push to
      # main, and website-oxc/package.json runs scripts/fetch-docs-wasm.ts
      # first, which downloads the engine named by website-oxc/wasm-pin.json
      # from a GitHub release and verifies every byte against the pin.
      #
      # Two rules keep that from ever breaking the live site again:
      #
      # 1. Assets are immutable. Every engine is published under its own
      #    release, wasm-demo-<inputs hash>, and never overwritten. A pin that
      #    names such a release keeps resolving forever, so a pin that lands
      #    late (or not at all) means an older engine stays live, not no
      #    engine. The rolling wasm-demo-latest release is left as it is and
      #    never written again: overwriting it under a pin that names it is
      #    exactly how the demo went down.
      # 2. The pin lands through a pull request. main is protected, so a push
      #    from here is rejected (that is how the 0.9.0 pin outlived the 0.11.0
      #    engine and took the demo down). The PR needs one approving review.
      #
      # Both steps fail this job when they fail: a red build here is the
      # signal, and the live-engine-check job below is the other one.
      # -----------------------------------------------------------------------
      - name: Publish the proven demo engine under an immutable release
        id: engine
        if: >-
          github.repository == 'tsrx-org/oxc' &&
          github.ref_name == 'main' &&
          hashFiles('docs/tools/demo-wasm/dist/demo-wasm.wasm') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          wasm="docs/tools/demo-wasm/dist/demo-wasm.wasm"
          worker="docs/tools/demo-wasm/dist/wasi-worker-browser.mjs"
          for file in "${wasm}" "${worker}"; do
            if [ ! -f "${file}" ]; then
              echo "::error::${file} is missing; the proven artifact is incomplete"
              exit 1
            fi
          done

          inputs_hash="$(node scripts/fetch-docs-wasm.ts --print-inputs-hash)"
          tag="wasm-demo-${inputs_hash:0:12}"

          # Same inputs, same release: the bytes CI proved first stay the bytes
          # every pin naming this tag resolves to, even if a rebuild of the same
          # sources is not bit-identical.
          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "${tag} already exists; keeping its assets."
          else
            gh release create "${tag}" \
              --title "${tag}" \
              --notes "Demo engine for the oxc.tsrx.dev playground, built from ${GITHUB_SHA} (engine inputs ${inputs_hash}). Immutable; pinned by website-oxc/wasm-pin.json. Not for installation." \
              "${wasm}" "${worker}"
          fi
          # wasm-demo-latest is deliberately no longer touched: a pin may still
          # name it, and overwriting its assets under such a pin is the outage
          # this step exists to prevent.

          # The pin describes what the release serves, so it is computed from
          # the release's own bytes, not from the local build.
          served="$(mktemp -d)"
          gh release download "${tag}" --dir "${served}" --pattern demo-wasm.wasm --pattern wasi-worker-browser.mjs
          pin="$(mktemp)"
          jq -n \
            --arg tag "${tag}" \
            --arg inputsHash "${inputs_hash}" \
            --arg sourceCommit "${GITHUB_SHA}" \
            --arg wasmSha "$(shasum -a 256 "${served}/demo-wasm.wasm" | cut -d' ' -f1)" \
            --argjson wasmBytes "$(stat -c%s "${served}/demo-wasm.wasm")" \
            --arg workerSha "$(shasum -a 256 "${served}/wasi-worker-browser.mjs" | cut -d' ' -f1)" \
            --argjson workerBytes "$(stat -c%s "${served}/wasi-worker-browser.mjs")" \
            '{
              tag: $tag,
              inputsHash: $inputsHash,
              sourceCommit: $sourceCommit,
              wasm: { sha256: $wasmSha, bytes: $wasmBytes },
              worker: { sha256: $workerSha, bytes: $workerBytes }
            }' > "${pin}"

          mkdir -p website-oxc
          if [ -f website-oxc/wasm-pin.json ] &&
            [ "$(jq -S 'del(.sourceCommit)' website-oxc/wasm-pin.json 2>/dev/null)" = "$(jq -S 'del(.sourceCommit)' "${pin}")" ]; then
            echo "The published engine is unchanged; the existing pin still describes it."
          else
            cp "${pin}" website-oxc/wasm-pin.json
            echo "Pinned ${tag} (inputs ${inputs_hash})"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Open the pin pull request when the pin changed
        if: >-
          github.repository == 'tsrx-org/oxc' &&
          github.ref_name == 'main' &&
          hashFiles('docs/tools/demo-wasm/dist/demo-wasm.wasm') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.engine.outputs.tag }}
        run: |
          set -euo pipefail
          git add website-oxc/wasm-pin.json
          if git diff --cached --quiet -- website-oxc/wasm-pin.json; then
            echo "The pin is unchanged; nothing to open."
            exit 0
          fi
          short="$(git rev-parse --short HEAD)"
          branch="site/wasm-pin-${short}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "site: pin wasm demo engine ${short}"
          git push --force origin "HEAD:refs/heads/${branch}"
          if gh pr list --head "${branch}" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create --base main --head "${branch}" \
              --title "site: pin wasm demo engine ${short}" \
              --body "Pins the demo engine built from ${GITHUB_SHA} (release ${TAG}) for oxc.tsrx.dev. Until this merges the site keeps serving the previously pinned engine, which stays available because engine releases are immutable. Opened by site-artifact.yml; needs one approving review."
          fi
          echo "::notice::pin pull request open on ${branch}; oxc.tsrx.dev serves the previous engine until it merges"


      - name: Fetch and embed Guessless docs
        run: |
          set -euo pipefail
          # Fetch the Guessless docs from compiled-run/guessless via tarball
          # (faster than full git clone) and copy them into docs/dist/guessless/
          # so they ship in the same artifact.
          echo "Fetching Guessless docs from compiled-run/guessless..."
          TEMP_DIR="$(mktemp -d)"
          curl -fsSL "https://github.com/compiled-run/guessless/archive/refs/heads/main.tar.gz" \
            | tar -xz -C "${TEMP_DIR}" --strip-components=1
          mkdir -p docs/dist/guessless
          cp -r "${TEMP_DIR}/site/guessless/." docs/dist/guessless/
          rm -rf "${TEMP_DIR}"
          echo "Guessless docs copied to docs/dist/guessless/"
          ls -la docs/dist/guessless/ | head -20

      - name: Upload the exact Vercel-shaped static artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxc-tsrx-docs-${{ github.sha }}
          path: docs/dist
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------------------
      # Second publication target: https://oxc.tsrx.dev, where the site owns the
      # whole domain and therefore sits at the root instead of under /oxc-tsrx.
      #
      # Absolute URLs (canonical, og:image, sitemap) and every in-page link are
      # baked in at build time from docs/site.config.mjs, so this cannot reuse
      # the artifact above -- it is a second build with a different origin and
      # base. It runs in this job rather than a job of its own so it reuses the
      # WASM artifact already on this runner; it costs one extra `docs:build`.
      #
      # Everything below is inert until someone with tsrx.dev access creates the
      # repository variables. Until then these steps skip and CI is unchanged.
      # See docs/releasing/site-oxc-tsrx-dev.md.
      # ---------------------------------------------------------------------
      - name: Build the oxc.tsrx.dev variant of the site
        if: vars.TSRX_VERCEL_ORG_ID != '' && vars.TSRX_VERCEL_PROJECT_ID != ''
        env:
          SITE_ORIGIN: https://oxc.tsrx.dev
          SITE_BASE: /
          # docs/build.mjs only accepts a custom output directory that is an
          # empty oxc-tsrx-* directory under the system temp root.
          OXC_TSRX_DOCS_OUT_DIR: /tmp/oxc-tsrx-tsrx-dev
          OXC_TSRX_REQUIRE_WASM: '1'
        run: |
          set -euo pipefail
          rm -rf /tmp/oxc-tsrx-tsrx-dev
          pnpm run docs:build
          # The Guessless docs fetched above are static bytes with no base-path
          # dependency, so the copy already in docs/dist is reused rather than
          # fetched a second time.
          cp -r docs/dist/guessless /tmp/oxc-tsrx-tsrx-dev/guessless

      - name: Upload the oxc.tsrx.dev static artifact
        if: vars.TSRX_VERCEL_ORG_ID != '' && vars.TSRX_VERCEL_PROJECT_ID != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxc-tsrx-docs-tsrx-dev-${{ github.sha }}
          path: /tmp/oxc-tsrx-tsrx-dev
          if-no-files-found: error
          retention-days: 14

  # Deliberately a separate job. The build above runs the whole dependency
  # graph -- pnpm postinstalls, 205 crates of cargo, every docs script -- and
  # none of that is ever in the same runner as the deploy credential. This job
  # does not check the repository out at all: it only unpacks the artifact the
  # build already proved and hands it to Vercel.
  deploy:
    needs: build
    if: github.repository == 'tsrx-org/oxc' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    environment:
      name: production
      url: https://compiled.run
    env:
      # The static docs project. Vercel's Git integration is deliberately not
      # connected: the site cannot be built on Vercel's image, so the artifact
      # the build job proved is the only thing that ever reaches production.
      VERCEL_ORG_ID: team_4TrBQsvIkFM0lYTqh08Fqxgd
      VERCEL_PROJECT_ID: prj_ErfsoKm2LTTCtEYIdlv7jw8cik1G
    steps:
      - name: Download the artifact the build job proved
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: oxc-tsrx-docs-${{ github.sha }}
          path: dist

      - name: Ship that artifact to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::VERCEL_TOKEN is not set on the production environment."
            exit 1
          fi
          url="$(npx --yes vercel@57.0.0 deploy \
            --cwd dist \
            --prod \
            --yes \
            --token "${VERCEL_TOKEN}")"
          echo "Deployed ${url}"

      - name: Prove production is serving this build
        run: |
          set -euo pipefail
          # The project's stable production alias: verification must not depend
          # on custom-domain DNS, which can change independently of a deploy.
          origin="https://oxc-tsrx-docs.vercel.app"
          # /oxc-tsrx is a legacy location now. The artifact's vercel.json
          # permanently redirects it, and everything under it, to the same path
          # on https://oxc.tsrx.dev (docs/site.config.mjs redirectTo). Prove the
          # redirect rather than the page: a 200 here would mean the old copy of
          # the docs is live again.
          expect_redirect() {
            local from="$1" to="$2" status location
            for attempt in 1 2 3 4 5; do
              status="$(curl -sS -o /dev/null -w '%{http_code}' "${from}" || echo 000)"
              if [ "${status}" = "308" ] || [ "${status}" = "301" ]; then
                break
              fi
              echo "attempt ${attempt}: ${from} returned ${status}, retrying"
              sleep 5
            done
            location="$(curl -sS -o /dev/null -w '%{redirect_url}' "${from}" || echo "")"
            if { [ "${status}" != "308" ] && [ "${status}" != "301" ]; } || [ "${location}" != "${to}" ]; then
              echo "::error::${from} answered ${status} -> '${location}', expected a permanent redirect to ${to}"
              exit 1
            fi
            echo "${from} -> ${to} (${status})"
          }
          expect_redirect "${origin}/oxc-tsrx" "https://oxc.tsrx.dev/"
          expect_redirect "${origin}/oxc-tsrx/guide/getting-started" "https://oxc.tsrx.dev/guide/getting-started"
          expect_redirect "${origin}/oxc-tsrx/playground?share=abc" "https://oxc.tsrx.dev/playground?share=abc"
          # The redirect alone would also "pass" against the previous deploy
          # once it is live, so hash a page that is not redirected: the domain
          # root landing page only matches if production is serving the
          # artifact this run built.
          curl -fsS "${origin}/" -o live-index.html
          live="$(shasum -a 256 < live-index.html | cut -d" " -f1)"
          built="$(shasum -a 256 < dist/index.html | cut -d" " -f1)"
          if [ "${live}" != "${built}" ]; then
            echo "::error::production serves index.html ${live}, this run built ${built}"
            exit 1
          fi
          echo "production is serving this run's build (${built})"

      - name: Prove Guessless docs are accessible
        run: |
          set -euo pipefail
          # Verify that the Guessless docs (from https://github.com/compiled-run/guessless)
          # are accessible after this oxc-tsrx deploy. The docs are now embedded as
          # static files under /guessless/ in the artifact.
          origin="https://oxc-tsrx-docs.vercel.app/guessless"
          echo "Checking that ${origin} is accessible..."
          for attempt in 1 2 3 4 5; do
            status_code="$(curl -fsS -o /dev/null -w '%{http_code}' "${origin}" || echo "000")"
            if [ "${status_code}" = "200" ]; then
              echo "✓ Guessless docs are accessible (HTTP ${status_code})"
              break
            fi
            if [ "${status_code}" = "404" ]; then
              echo "::error::Guessless returned 404! The static docs were not embedded."
              exit 1
            fi
            echo "attempt ${attempt}: got HTTP ${status_code}, retrying..."
            sleep 5
          done
          if [ "${status_code}" != "200" ]; then
            echo "::error::Could not verify Guessless docs accessibility after 5 attempts"
            exit 1
          fi
          
          # Also verify via the custom domain (compiled.run)
          custom_origin="https://compiled.run/guessless"
          echo "Checking that ${custom_origin} is accessible..."
          for attempt in 1 2 3 4 5; do
            custom_status="$(curl -fsS -o /dev/null -w '%{http_code}' "${custom_origin}" || echo "000")"
            if [ "${custom_status}" = "200" ]; then
              echo "✓ Guessless docs accessible via custom domain (HTTP ${custom_status})"
              exit 0
            fi
            if [ "${custom_status}" = "404" ]; then
              echo "::error::Guessless at custom domain returned 404!"
              exit 1
            fi
            echo "attempt ${attempt}: custom domain got HTTP ${custom_status}, retrying..."
            sleep 5
          done
          echo "::error::Could not verify Guessless via custom domain after 5 attempts"
          exit 1

  # The oxc.tsrx.dev publication, deliberately independent of the deploy job
  # above: a different Vercel project, a different token, a different artifact,
  # and no shared failure. Neither can block or break the other.
  #
  # It is driven entirely by repository configuration, so whoever holds tsrx.dev
  # and the TSRX Vercel team can turn it on without touching this file:
  #
  #   vars.TSRX_VERCEL_ORG_ID       repository variable
  #   vars.TSRX_VERCEL_PROJECT_ID   repository variable
  #   secrets.TSRX_VERCEL_TOKEN     repository (or tsrx-dev environment) secret
  #
  # Secrets cannot be read in an `if:`, so the two variables are what gate this
  # job. With them unset the job is skipped, not failed, and the artifact it
  # would consume is never built either. Full instructions:
  # docs/releasing/site-oxc-tsrx-dev.md
  deploy-tsrx-dev:
    name: Deploy oxc.tsrx.dev
    needs: build
    if: >-
      github.ref_name == 'main' &&
      vars.TSRX_VERCEL_ORG_ID != '' &&
      vars.TSRX_VERCEL_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    environment:
      name: tsrx-dev
      url: https://oxc.tsrx.dev
    env:
      VERCEL_ORG_ID: ${{ vars.TSRX_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.TSRX_VERCEL_PROJECT_ID }}
    steps:
      - name: Download the root-base artifact the build job produced
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: oxc-tsrx-docs-tsrx-dev-${{ github.sha }}
          path: dist

      - name: Ship that artifact to the TSRX Vercel project
        id: ship
        env:
          VERCEL_TOKEN: ${{ secrets.TSRX_VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::TSRX_VERCEL_TOKEN is not set, but TSRX_VERCEL_ORG_ID and TSRX_VERCEL_PROJECT_ID are. See docs/releasing/site-oxc-tsrx-dev.md."
            exit 1
          fi
          url="$(npx --yes vercel@57.0.0 deploy \
            --cwd dist \
            --prod \
            --yes \
            --token "${VERCEL_TOKEN}")"
          echo "Deployed ${url}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Prove that deployment is serving this build
        env:
          DEPLOYMENT_URL: ${{ steps.ship.outputs.url }}
        run: |
          set -euo pipefail
          # Verified against the deployment URL the CLI just printed, not
          # against oxc.tsrx.dev: this must prove the bytes, and a custom domain
          # can be mid-DNS-propagation or absent entirely on the first run.
          for attempt in 1 2 3 4 5; do
            if curl -fsS "${DEPLOYMENT_URL}/demo-capabilities.json" -o capabilities.json; then
              break
            fi
            echo "attempt ${attempt} could not read the live capabilities, retrying"
            sleep 5
          done
          node -e '
            const live = require("./capabilities.json")
            if (!live.ok || !live.wasm || live.mode !== "wasm") {
              throw new Error(`deployment is not serving the WebAssembly engine: ${JSON.stringify(live)}`)
            }
          '
          # demo-capabilities.json is byte-identical across builds, so hash the
          # page itself: that only matches if this run's artifact is live. The
          # site is at the deploy root here, so index.html is at the root.
          curl -fsS "${DEPLOYMENT_URL}" -o live-index.html
          live="$(shasum -a 256 < live-index.html | cut -d" " -f1)"
          built="$(shasum -a 256 < dist/index.html | cut -d" " -f1)"
          if [ "${live}" != "${built}" ]; then
            echo "::error::deployment serves index.html ${live}, this run built ${built}"
            exit 1
          fi
          echo "the deployment is serving this run's build (${built})"

      - name: Report whether oxc.tsrx.dev resolves to it
        continue-on-error: true
        run: |
          set -uo pipefail
          # Informational only. The deploy is already proven above; whether the
          # custom domain points at this project is a DNS fact that no push can
          # fix, so it must never turn a good deploy into a red run.
          status="$(curl -fsS -o /dev/null -w '%{http_code}' https://oxc.tsrx.dev || echo 000)"
          if [ "${status}" = "200" ]; then
            echo "::notice::https://oxc.tsrx.dev is live"
          else
            echo "::warning::https://oxc.tsrx.dev returned ${status}; add the domain and DNS record per docs/releasing/site-oxc-tsrx-dev.md"
          fi

  # The signal the owner asked for after the 0.11.0 outage: the live site is
  # asked whether the playground engine it serves is the one main pins, and
  # this job is red when it is not. Nothing here deploys; it only looks. The
  # Git-connected Vercel project builds from this same push, so the answer is
  # polled for a while before it is believed.
  live-engine-check:
    name: Live engine check (oxc.tsrx.dev)
    needs: build
    if: github.repository == 'tsrx-org/oxc' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the pin main carries
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prove oxc.tsrx.dev serves the pinned engine
        run: |
          set -euo pipefail
          expected="$(jq -r .wasm.sha256 website-oxc/wasm-pin.json)"
          base="https://oxc.tsrx.dev/assets/demo-wasm"
          deadline=$((SECONDS + 1200))
          while :; do
            engine="$(curl -s -o /dev/null -w '%{http_code}' "${base}/engine.js")"
            worker="$(curl -s -o /dev/null -w '%{http_code}' "${base}/wasi-worker-browser.mjs")"
            wasm="$(curl -s -o /tmp/served.wasm -w '%{http_code}' "${base}/demo-wasm.wasm32-wasi.wasm")"
            served="$(sha256sum /tmp/served.wasm | cut -d' ' -f1)"
            if [ "${engine}" = "200" ] && [ "${worker}" = "200" ] && [ "${wasm}" = "200" ] && [ "${served}" = "${expected}" ]; then
              echo "::notice::oxc.tsrx.dev serves the pinned engine ${expected:0:12}"
              exit 0
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::oxc.tsrx.dev is not serving the pinned engine: engine.js ${engine}, worker ${worker}, wasm ${wasm} (sha ${served:0:12}, pin ${expected:0:12}). The playground is on its static preview or an unexpected engine."
              exit 1
            fi
            sleep 30
          done
