name: Build release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  npm_config_audit: "false"
  npm_config_fund: "false"

jobs:
  build-native:
    name: ${{ matrix.package_suffix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            package_suffix: darwin-arm64
            runner: macos-14
            expected_platform: darwin
            expected_arch: arm64
            macos_deployment_target: "11.0"
          - target: x86_64-apple-darwin
            package_suffix: darwin-x64
            runner: macos-15-intel
            expected_platform: darwin
            expected_arch: x64
            macos_deployment_target: "10.15"
          - target: aarch64-unknown-linux-gnu
            package_suffix: linux-arm64-gnu
            runner: ubuntu-22.04-arm
            expected_platform: linux
            expected_arch: arm64
            libc: gnu
          - target: x86_64-unknown-linux-gnu
            package_suffix: linux-x64-gnu
            runner: ubuntu-22.04
            expected_platform: linux
            expected_arch: x64
            libc: gnu
          - target: aarch64-unknown-linux-musl
            package_suffix: linux-arm64-musl
            runner: ubuntu-22.04-arm
            expected_platform: linux
            expected_arch: arm64
            libc: musl
          - target: x86_64-unknown-linux-musl
            package_suffix: linux-x64-musl
            runner: ubuntu-22.04
            expected_platform: linux
            expected_arch: x64
            libc: musl
          - target: aarch64-pc-windows-msvc
            package_suffix: win32-arm64-msvc
            runner: windows-11-arm
            expected_platform: win32
            expected_arch: arm64
          - target: x86_64-pc-windows-msvc
            package_suffix: win32-x64-msvc
            runner: windows-2025
            expected_platform: win32
            expected_arch: x64
    env:
      TARGET: ${{ matrix.target }}
      PACKAGE_SUFFIX: ${{ matrix.package_suffix }}
      EXPECTED_PLATFORM: ${{ matrix.expected_platform }}
      EXPECTED_ARCH: ${{ matrix.expected_arch }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install the pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Prove the runner matches the package ABI
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          assert.equal(process.platform, process.env.EXPECTED_PLATFORM);
          assert.equal(process.arch, process.env.EXPECTED_ARCH);
          NODE

      - name: Install the musl linker
        if: matrix.libc == 'musl'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install the pinned release Rust toolchain and target
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add "$TARGET"
          rustc -Vv

      - name: Install the locked JavaScript graph without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the editor bundle and native executables
        shell: bash
        run: |
          pnpm run build:editor
          pnpm run licenses:vscode:check
          # The parser addon is built --offline further down, and cc is a
          # build-dependency of napi-build rather than of oxc_tsrx_cli, so
          # building the CLI alone never populates it. Fetch the whole
          # workspace first or that offline build fails on a clean runner.
          cargo fetch --locked
          cargo build --release --locked --target "$TARGET" -p oxc_tsrx_cli --bins

      - name: Verify Linux ABI policy
        if: matrix.libc == 'gnu' || matrix.libc == 'musl'
        shell: bash
        run: |
          # The crate builds one binary. `oxc-tsrx-fmt` and `oxc-tsrx-lsp` are
          # names it answers to through argv[0], not separate files.
          bins=(oxc-tsrx)
          if [[ "${{ matrix.libc }}" == "musl" ]]; then
            for name in "${bins[@]}"; do
              bin="target/$TARGET/release/$name"
              file "$bin"
              ldd_output="$(ldd "$bin" 2>&1 || true)"
              printf '%s\n' "$ldd_output"
              grep -Eq 'statically linked|not a dynamic executable' <<< "$ldd_output"
              "$bin" --version
            done
          else
            for name in "${bins[@]}"; do
              bin="target/$TARGET/release/$name"
              file "$bin"
              required="$(objdump -T "$bin" | grep -Eo 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -n 1)"
              printf '%s highest required glibc symbol: %s\n' "$name" "$required"
              [[ "$required" =~ ^GLIBC_[0-9]+\.[0-9]+$ ]]
              [[ "$(printf '%s\n' "$required" GLIBC_2.35 | sort -V | tail -n 1)" == GLIBC_2.35 ]]
              "$bin" --version
            done
          fi

      # This step used to sit below the smoke, so the addon was built after the
      # only place that could have run it and no target but the developer's own
      # ever loaded one. It now precedes the smoke, and the smoke opens it.
      - name: Build the parser addon for this target
        shell: bash
        run: |
          # Ships inside the same native package as the binaries. Without it npm
          # drops parser.node from the tarball and `@tsrx/oxc/parser` fails its
          # integrity check on every consumer, which is exactly what 0.1.0 did.
          node scripts/build-parser-native.ts \
            --target "$TARGET" \
            --out "release/addon/parser.node" \
            --record "release/addon/parser-addon-$PACKAGE_SUFFIX.json"
          # The loader reads an addon's identity record from beside the addon it
          # is pointed at, so the load check below needs the record under the
          # default name too. The suffixed copy stays as per-target evidence.
          cp "release/addon/parser-addon-$PACKAGE_SUFFIX.json" "release/addon/parser.node.json"

      - name: Smoke the companion CLIs on this host
        shell: bash
        run: |
          suffix=""
          if [[ "$EXPECTED_PLATFORM" == "win32" ]]; then suffix=".exe"; fi
          # One multi-call executable now carries lint, fmt, and lsp. All three
          # overrides point at the same file; the JavaScript launchers add the
          # `fmt` and `lsp` subcommands themselves.
          native="$GITHUB_WORKSPACE/target/$TARGET/release/oxc-tsrx$suffix"
          export OXC_TSRX_LINT_BIN="$native"
          export OXC_TSRX_FORMAT_BIN="$native"
          export OXC_TSRX_LSP_BIN="$native"
          node --test tests/packaging/runtime-contract.test.mjs tests/vite/package-seam.test.mjs

      - name: Load the parser addon built for this target
        # musl is excluded by decision, not for convenience. These two targets
        # cross-compile on a glibc runner, and a musl-linked `.node` cannot be
        # dlopen'd by a glibc Node, so there is no host here that could open it.
        # The musl addon is built, checksummed, and packaged without ever being
        # loaded anywhere, which is what the published support matrix labels.
        if: matrix.libc != 'musl'
        shell: bash
        run: |
          OXC_TSRX_PARSER_ADDON="$GITHUB_WORKSPACE/release/addon/parser.node" \
            pnpm run test:parser-addon

      - name: Package the native npm artifact and target VSIX
        shell: bash
        run: |
          mkdir -p "release/$PACKAGE_SUFFIX"
          suffix=""
          if [[ "$EXPECTED_PLATFORM" == "win32" ]]; then suffix=".exe"; fi
          node scripts/package-native.ts \
            --target "$TARGET" \
            --bin-dir "target/$TARGET/release" \
            --parser-addon "release/addon/parser.node" \
            --out-dir "release/$PACKAGE_SUFFIX" \
            | tee "release/$PACKAGE_SUFFIX/native-package-$PACKAGE_SUFFIX.json"
          node scripts/package-vscode.ts \
            --target "$TARGET" \
            --lsp-bin "target/$TARGET/release/oxc-tsrx$suffix" \
            --out-dir "release/$PACKAGE_SUFFIX" \
            | tee "release/$PACKAGE_SUFFIX/vscode-package-$PACKAGE_SUFFIX.json"

      - name: Upload the target candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.package_suffix }}
          path: release/${{ matrix.package_suffix }}
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Checksums, SBOMs, and staged provenance
    needs:
      - build-native
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install the pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install Rust 1.97.0 for SBOM tooling
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download all target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Pack the platform-independent npm packages
        shell: bash
        run: |
          npm pack --pack-destination release ./packages/toolchain

      - name: Verify the complete package and VSIX matrix
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readdir, readFile } from "node:fs/promises";
          import { basename } from "node:path";
          import {
            NATIVE_TARGETS,
            nativePackageName,
          } from "./packages/toolchain/dist/native-targets.js";

          const files = (await readdir("release")).sort();
          const version = JSON.parse(await readFile("package.json", "utf8")).version;
          const extensionManifest = JSON.parse(
            await readFile("packages/vscode/package.json", "utf8"),
          );
          const extensionId = `${extensionManifest.publisher}.${extensionManifest.name}`;
          // npm pack flattens `@tsrx/oxc-<suffix>` to `tsrx-oxc-<suffix>-<version>.tgz`,
          // the same rule publish.yml and scripts/vsix-archive.ts spell out.
          const expectedNative = NATIVE_TARGETS.map(
            ({ packageSuffix }) => `tsrx-oxc-${packageSuffix}-${version}.tgz`,
          );
          const expectedVsix = NATIVE_TARGETS.map(
            ({ vscodeTarget }) => `oxc-tsrx-vscode-${version}-${vscodeTarget}.vsix`,
          );
          for (const name of [...expectedNative, ...expectedVsix]) {
            assert.ok(files.includes(name), `missing release artifact: ${name}`);
          }
          // Eight platform packages plus the one public package. The four
          // internal packages that used to be here were folded into it.
          assert.equal(files.filter((name) => name.endsWith(".tgz")).length, 9);
          assert.equal(files.filter((name) => name.endsWith(".vsix")).length, 8);

          const expectedReports = NATIVE_TARGETS.flatMap(({ packageSuffix }) => [
            `native-package-${packageSuffix}.json`,
            `vscode-package-${packageSuffix}.json`,
          ]).sort();
          const reports = files.filter((name) => /^(?:native|vscode)-package-.*\.json$/u.test(name));
          assert.deepEqual(reports, expectedReports, "release report matrix must be exact");

          const nativeTargets = new Set();
          const vscodeTargets = new Set();
          for (const platform of NATIVE_TARGETS) {
            const [native, vscode] = await Promise.all([
              readFile(`release/native-package-${platform.packageSuffix}.json`, "utf8").then(
                JSON.parse,
              ),
              readFile(`release/vscode-package-${platform.packageSuffix}.json`, "utf8").then(
                JSON.parse,
              ),
            ]);
            const nativeFilename = `tsrx-oxc-${platform.packageSuffix}-${version}.tgz`;
            const vscodeFilename = `oxc-tsrx-vscode-${version}-${platform.vscodeTarget}.vsix`;

            assert.equal(native.packageName, nativePackageName(platform));
            assert.equal(native.version, version);
            assert.equal(native.target, platform.target);
            assert.equal(native.vscodeTarget, platform.vscodeTarget);
            assert.equal(native.filename, nativeFilename);
            assert.equal(basename(native.tarball), nativeFilename);
            assert.match(native.lspSha256, /^[a-f0-9]{64}$/u);
            assert.ok(Number.isSafeInteger(native.lspBytes) && native.lspBytes > 0);

            assert.equal(vscode.extensionId, extensionId);
            assert.equal(vscode.version, version);
            assert.equal(vscode.target, platform.target);
            assert.equal(vscode.vscodeTarget, platform.vscodeTarget);
            assert.equal(basename(vscode.vsix), vscodeFilename);
            assert.equal(vscode.lspSha256, vscode.vsixVerification.nativeLspSha256);
            assert.equal(vscode.lspBytes, vscode.vsixVerification.nativeLspBytes);
            assert.equal(native.lspSha256, vscode.lspSha256);
            assert.equal(native.lspBytes, vscode.lspBytes);
            assert.equal(native.lspSha256, vscode.vsixVerification.nativeLspSha256);
            assert.equal(native.lspBytes, vscode.vsixVerification.nativeLspBytes);
            assert.equal(vscode.vsixVerification.extensionId, extensionId);
            assert.equal(vscode.vsixVerification.version, version);
            assert.equal(vscode.vsixVerification.target, platform.target);
            assert.equal(vscode.vsixVerification.vscodeTarget, platform.vscodeTarget);

            assert.equal(nativeTargets.has(native.target), false, `duplicate ${native.target}`);
            assert.equal(
              vscodeTargets.has(vscode.vscodeTarget),
              false,
              `duplicate ${vscode.vscodeTarget}`,
            );
            nativeTargets.add(native.target);
            vscodeTargets.add(vscode.vscodeTarget);
          }
          assert.equal(nativeTargets.size, NATIVE_TARGETS.length);
          assert.equal(vscodeTargets.size, NATIVE_TARGETS.length);
          NODE
          node scripts/vsix-archive.ts release/*.vsix

      - name: Stage legal texts and locked dependency inventory
        shell: bash
        run: |
          pnpm run licenses:check
          mkdir -p release/legal
          cp LICENSE THIRD_PARTY_NOTICES.md release/legal/
          cp -R licenses release/legal/licenses
          cp -R packages/vscode/licenses release/legal/vscode-licenses

      - name: Generate JavaScript and Rust CycloneDX SBOMs
        shell: bash
        run: |
          mkdir -p release/sbom
          npm_sbom_root="$RUNNER_TEMP/oxc-tsrx-release-sbom"
          mkdir -p "$npm_sbom_root"
          NPM_SBOM_ROOT="$npm_sbom_root" node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import { resolve } from "node:path";
          import {
            NATIVE_TARGETS,
            nativePackageName,
          } from "./packages/toolchain/dist/native-targets.js";

          const version = JSON.parse(await readFile("package.json", "utf8")).version;
          const artifact = (name) => `file:${resolve("release", name)}`;
          const dependencies = {
            "@tsrx/oxc": artifact(`tsrx-oxc-${version}.tgz`),
          };
          for (const target of NATIVE_TARGETS) {
            dependencies[nativePackageName(target)] = artifact(
              `tsrx-oxc-${target.packageSuffix}-${version}.tgz`,
            );
          }
          await writeFile(
            resolve(process.env.NPM_SBOM_ROOT, "package.json"),
            `${JSON.stringify(
              {
                name: "oxc-tsrx-release-candidate",
                version,
                private: true,
                dependencies,
              },
              null,
              2,
            )}\n`,
          );
          NODE
          # A real install into the throwaway prefix, not --package-lock-only.
          # `npm sbom` reports ESBOMPROBLEMS "missing: @tsrx/oxc@file:..." when the
          # tree is only locked and never materialised, so the lock-only pair
          # produced an empty SBOM and a failed step. This prefix holds nothing
          # but the nine release tarballs, so installing it costs about a second.
          npm install \
            --prefix "$npm_sbom_root" \
            --ignore-scripts \
            --force \
            --no-audit \
            --no-fund
          npm sbom \
            --prefix "$npm_sbom_root" \
            --force \
            --sbom-format=cyclonedx \
            --sbom-type=application \
            > release/sbom/npm.cdx.json
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import {
            NATIVE_TARGETS,
            nativePackageName,
          } from "./packages/toolchain/dist/native-targets.js";

          const sbom = JSON.parse(await readFile("release/sbom/npm.cdx.json", "utf8"));
          assert.equal(sbom.bomFormat, "CycloneDX");
          const names = new Set((sbom.components ?? []).map(({ name }) => name));
          for (const name of [
            "@tsrx/oxc",
            ...NATIVE_TARGETS.map(nativePackageName),
          ]) {
            assert.ok(names.has(name), `npm SBOM is missing ${name}`);
          }
          NODE
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx \
            --manifest-path crates/oxc_tsrx_cli/Cargo.toml \
            --format json \
            --describe binaries \
            --spec-version 1.5
          find crates/oxc_tsrx_cli -maxdepth 1 -name '*.cdx.json' \
            -exec cp {} release/sbom/ \;
          # `--describe binaries` writes one document per [[bin]] target, plus
          # npm.cdx.json from the JavaScript half. The crate declared three
          # binaries until they were merged into one multi-call executable, so
          # this count was 4 and is now 2. Derived rather than hard-coded, so
          # merging or adding a binary cannot silently pass an empty SBOM.
          # Count only oxc_tsrx_cli's binaries. `cargo metadata --no-deps`
          # returns every workspace member, and the two benchmark crates each
          # declare a binary that cargo-cyclonedx is not asked to describe here.
          bins=$(cargo metadata --no-deps --format-version 1 \
            --manifest-path crates/oxc_tsrx_cli/Cargo.toml \
            | node -e 'const m=JSON.parse(require("fs").readFileSync(0,"utf8"));const p=m.packages.find((x)=>x.name==="oxc_tsrx_cli");if(!p)throw new Error("oxc_tsrx_cli not found in cargo metadata");process.stdout.write(String(p.targets.filter((t)=>t.kind.includes("bin")).length))')
          expected=$((bins + 1))
          actual=$(find release/sbom -name '*.cdx.json' | wc -l | tr -d ' ')
          if [ "$actual" -lt "$expected" ]; then
            echo "expected at least $expected SBOM documents ($bins binaries plus npm), found $actual" >&2
            exit 1
          fi

      - name: Write the unsigned provenance staging statement
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readdir, readFile, writeFile } from "node:fs/promises";

          const artifacts = (await readdir("release"))
            .filter((name) => name.endsWith(".tgz") || name.endsWith(".vsix"))
            .sort();
          const subject = [];
          for (const name of artifacts) {
            const sha256 = createHash("sha256")
              .update(await readFile(`release/${name}`))
              .digest("hex");
            subject.push({ name, digest: { sha256 } });
          }
          const statement = {
            _type: "https://in-toto.io/Statement/v1",
            subject,
            predicateType: "https://slsa.dev/provenance/v1",
            predicate: {
              buildDefinition: {
                buildType: `https://github.com/${process.env.REPOSITORY}/actions/workflows/release-candidate.yml`,
                externalParameters: { ref: process.env.SOURCE_REF },
                internalParameters: { attestationStatus: "unsigned-staging-only" },
                resolvedDependencies: [
                  {
                    uri: `git+https://github.com/${process.env.REPOSITORY}.git@${process.env.SOURCE_SHA}`,
                    digest: { sha1: process.env.SOURCE_SHA },
                  },
                ],
              },
              runDetails: {
                builder: { id: process.env.WORKFLOW_REF },
                metadata: {
                  invocationId: `https://github.com/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}/attempts/${process.env.RUN_ATTEMPT}`,
                },
              },
            },
          };
          await writeFile(
            "release/provenance.unsigned.intoto.json",
            `${JSON.stringify(statement, null, 2)}\n`,
          );
          NODE

      - name: Generate final SHA-256 checksums
        shell: bash
        run: |
          cd release
          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload the complete release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 14
