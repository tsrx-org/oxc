name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # This repository installs its own graph with pnpm. These two stay because the
  # packaging suites drive npm, Bun, and Yarn as real consumers, and the npm
  # lanes are quieter without audit and funding output.
  npm_config_audit: "false"
  npm_config_fund: "false"

jobs:
  correctness:
    name: Node 24.15.0 / Rust 1.97.0 (correctness)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # pnpm has to be on PATH before setup-node, because `cache: pnpm` asks
      # pnpm where its store is. The version comes from `packageManager` in the
      # root package.json, so there is exactly one place to bump it.
      - name: Install the pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install Rust 1.97.0
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
          rustup default 1.97.0
          rustc -Vv
          cargo -V

      # Without this every job recompiles the whole oxc dependency graph from
      # scratch, which is what pushed these lanes into the 50 minute timeout.
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          key: correctness
          cache-all-crates: true

      - name: Install the locked JavaScript graph without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify lockfiles, source boundaries, licenses, and formatting
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo fmt --all -- --check
          pnpm run licenses:check
          node --test tests/packaging/boundary.test.mjs

      - name: Lint and test the Rust workspace
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked

      - name: Build the distributable native executables and parser addon
        shell: bash
        run: |
          # build:parser-native builds parser_napi_binding with --offline, and
          # cc is a build-dependency of napi-build rather than of oxc_tsrx_cli,
          # so building the CLI alone never populates it. Fetch the whole
          # workspace first or the offline build fails on a clean runner.
          cargo fetch --locked
          cargo build --release --locked -p oxc_tsrx_cli --bins
          node scripts/build-parser-native.ts

      - name: Test the product and package contracts
        shell: bash
        run: |
          pnpm test
          pnpm run test:packaging:unit
          # The parser addon's own suite. It packs and installs the real
          # tarballs, so it is the only lane that would have caught 0.1.0
          # shipping every native package without parser.node.
          pnpm run test:parser-api

  product-floor:
    name: Product floor / Node ${{ matrix.node }} / Rust 1.96.0
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20.19.0
          - 22.12.0
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install the pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install the tooling Node.js 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0

      - name: Capture the tooling Node.js executable
        shell: bash
        run: echo "TSRX_SCRIPT_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"

      - name: Install the product-floor Node.js lane
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install Rust 1.96.0
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy
          rustup default 1.96.0
          rustc -Vv
          cargo -V

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          key: product-floor-node-${{ matrix.node }}
          cache-all-crates: true

      # Both product-floor lanes pin Rust 1.96.0, so running the workspace lint
      # and test on both is the same work twice. These lanes vary the Node floor;
      # Rust is covered once per distinct toolchain.
      - name: Lint and test the Rust workspace
        if: matrix.node == '20.19.0'
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked

      - name: Install the locked JavaScript graph without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the distributable native executables and parser addon
        shell: bash
        run: |
          cargo fetch --locked
          cargo build --release --locked -p oxc_tsrx_cli --bins
          "$TSRX_SCRIPT_NODE" scripts/build-parser-native.ts

      - name: Test the published-product floor
        shell: bash
        run: |
          pnpm test
          pnpm run test:packaging:unit:floor
          pnpm run test:parser-api

  install-arbitration:
    # The install-only route reaches a released host through `node_modules/.bin`,
    # and every step of it is platform shaped: npm links a symlink on POSIX and
    # generates `.cmd`/`.ps1` shims on Windows, an extensionless Node wrapper is
    # executable on POSIX and not on Windows, and a drive-lettered path is not a
    # module specifier. These lanes had never run outside one developer's macOS
    # machine, so a Windows runner is what makes the claim checkable at all.
    #
    # It also builds the native executables and the parser addon, so it is the
    # one job that can execute them without paying for a second build. Until
    # that execution existed, every non-Linux claim in this repository rested on
    # release-candidate.yml, which only fires on workflow_dispatch: real
    # coverage at release time and none on the change that broke it.
    #
    # macos-latest is an arm64 image, so this is where darwin-arm64 stops being
    # a claim backed by the machine the code was written on. Every step below is
    # keyed on `matrix.expected_platform` rather than on a runner name, so a row
    # is the whole cost of covering a platform.
    name: Install and arbitration (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            expected_platform: linux
          - runner: windows-latest
            expected_platform: win32
          - runner: macos-latest
            expected_platform: darwin
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install the pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      # The provider matrix drives Bun and Deno as real consumers, and neither
      # ships on any GitHub runner image. Without these two steps those lanes
      # find no executable and skip themselves, which reads as a green run and
      # covers nothing. OXC_TSRX_REQUIRE_PM_LANES below turns that skip into a
      # failure, so a lane can never go quiet again.
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Prove the runner is the platform this lane claims to cover
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.expected_platform }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          assert.equal(process.platform, process.env.EXPECTED_PLATFORM);
          NODE

      - name: Install Rust 1.96.0
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustc -Vv

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          key: ${{ matrix.runner }}
          cache-all-crates: true

      - name: Install the locked JavaScript graph without lifecycle scripts
        # Verbose because a linking failure here exits 1 without naming the file
        # it was writing, which is exactly the shape a MAX_PATH overrun takes.
        run: pnpm install --frozen-lockfile --ignore-scripts --loglevel=debug

      - name: Build the distributable native executables and parser addon
        shell: bash
        run: |
          # See the correctness job: the parser addon builds --offline, so the
          # whole workspace must be fetched first on a clean runner.
          cargo fetch --locked
          pnpm run build:native
          pnpm run build:parser-native

      - name: Run a real lint, format, and language-server session on this host
        # Mirrors the smoke release-candidate.yml runs on all eight targets, on
        # a lane that fires on push and pull request. The three overrides point
        # at the one multi-call executable built above; the JavaScript launchers
        # add the `fmt` and `lsp` subcommands themselves. Nothing here is a
        # packaging assertion: these suites spawn the binary and read what it
        # actually emits.
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.expected_platform }}
        run: |
          suffix=""
          if [[ "$EXPECTED_PLATFORM" == "win32" ]]; then suffix=".exe"; fi
          native="$GITHUB_WORKSPACE/target/release/oxc-tsrx$suffix"
          export OXC_TSRX_LINT_BIN="$native"
          export OXC_TSRX_FORMAT_BIN="$native"
          export OXC_TSRX_LSP_BIN="$native"
          node --test tests/packaging/runtime-contract.test.mjs tests/vite/package-seam.test.mjs

      - name: Load the parser addon built on this host
        # `build:parser-native` above wrote packages/toolchain/parser.node and
        # its identity record, and nothing opened them. The first command loads
        # that exact file through the shipped loader; the suite after it packs
        # and installs the real tarballs, which is the route a consumer takes.
        shell: bash
        run: |
          OXC_TSRX_PARSER_ADDON="$GITHUB_WORKSPACE/packages/toolchain/parser.node" \
            pnpm run test:parser-addon
          pnpm run test:parser-api

      - name: Prove this host could publish what it just built
        # The pre-publish gate, run on the artifacts this lane can produce. It
        # packs this host's own platform package from the binaries and the addon
        # built above, packs the public package, asserts that every path each
        # manifest promises is really inside its tarball, installs both into a
        # project outside the workspace, lints and parses through the installed
        # package, and rehearses `npm publish --dry-run`.
        #
        # publish.yml runs the same gate across all nine release tarballs. This
        # step is what makes it fail on the pull request that broke packaging
        # rather than on release day, and it is the only place the gate runs on
        # win32-x64-msvc and darwin-arm64 at all.
        run: node scripts/check-publish-artifacts.ts --pack-host

      - name: Exercise a plain install against released hosts
        run: pnpm run test:packaging:released-hosts

      - name: Exercise the package-manager provider matrix
        env:
          # Every lane this runner provisions must actually run. A missing
          # package manager fails the job instead of skipping the lane.
          OXC_TSRX_REQUIRE_PM_LANES: npm,pnpm,bun,deno,yarn_node_modules,yarn_pnp
        run: pnpm run test:packaging:providers

      - name: Test the package contracts
        run: pnpm run test:packaging:unit

  supported-vite-plus:
    name: Clean install / Vite+ 0.1.24 and 0.2.4
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install the pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install Rust 1.96.0
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          key: vite-plus
          cache-all-crates: true

      - name: Install locked development dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build release binaries
        run: cargo build --release --locked -p oxc_tsrx_cli --bins

      - name: Exercise untouched tarballs in an empty consumer
        env:
          OXC_TSRX_RETAIN_CLEAN_INSTALL_REPORT: "1"
        run: node --test tests/packaging/clean-install.test.mjs

      - name: Prove the JS plugin lane survives packaging
        # The lane is JavaScript that only ships if `files` lists it, and two
        # native modes that only exist if the binary was rebuilt. Both can be
        # dropped from a tarball without any other test noticing, which is
        # exactly how parser.node went missing from every 0.1.0 package.
        run: node --test tests/packaging/js-plugin-clean-install.test.mjs

      - name: Exercise the supported Vite+ minimum and current lanes
        env:
          OXC_TSRX_RETAIN_MATRIX_REPORT: "1"
        run: node --test tests/packaging/vite-plus-matrix.test.mjs

      - name: Prove the explicit bridge survives npm, pnpm and Bun isolation
        # This script existed and no workflow ran it, which is the same as not
        # having it. It is the unit-level companion to the survival lane below.
        run: pnpm run test:packaging:compat

      - name: Prove the editor wiring survives dependency reinstall
        # The owner's non-negotiable, as a gate: install alongside a package that
        # takes `node_modules/.bin/oxlint` the way Vite+ does, run `setup` once,
        # then `pnpm add`, `remove`, `install`, `install --frozen-lockfile` and
        # `rebuild`, and require the editor to still resolve `.tsrx` linting into
        # `node_modules/oxc-tsrx` every time, with `setup` never run again. The
        # suite's last case breaks the wiring on purpose and fails if the check
        # stays green.
        run: pnpm run test:packaging:reinstall

      - name: Retain consumer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supported-consumer-reports
          path: |
            tests/packaging/clean-install-report.json
            tests/packaging/vite-plus-matrix-report.json
          if-no-files-found: error
          retention-days: 14
